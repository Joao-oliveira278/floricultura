<style>
:root{
  --verde-alecrim:#1f3a2e;

  --sálvia-clara:#c9d8c4;
  --papel:#f7f2e7;
  --creme:#fffdf8;
  --rosa:#c5294f;
  --rosa-clara:#f3dde1;
  --tinta:#20281f;
  --tinta-suave:#4a5245;
  --sombra: 0 18px 40px -20px rgba(31,58,46,.35);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--papel);
  color:var(--tinta);
  font-family:'Work Sans',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:40px 16px;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--verde-alecrim);}
.script{font-family:'Caveat',cursive;font-weight:600;}

.carousel-wrap{
  width:100%;
  max-width:480px;
}
.carousel-head{
  text-align:center;
  margin-bottom:22px;
}
.carousel-head .eyebrow{
  font-family:'Caveat',cursive;
  font-size:1.3rem;
  color:var(--rosa);
  font-weight:700;
}
.carousel-head .eyebrow::before{content:"❧ ";color:var(--sálvia);}
.carousel-head h1{font-size:1.7rem;}

.carousel{
  position:relative;
  background:var(--creme);
  border-radius:26px;
  box-shadow:var(--sombra);
  overflow:hidden;
}
.track{
  display:flex;
  transition:transform .5s cubic-bezier(.65,0,.35,1);
}
.slide{
  min-width:100%;
  display:flex;
  flex-direction:column;
}
.slide .imgwrap{
  aspect-ratio:1/1;
  overflow:hidden;
  position:relative;
  background:var(--sálvia-clara);
}
.slide .imgwrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.slide .price-tag{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(255,253,248,.94);
  color:var(--rosa);
  font-weight:700;
  font-size:.95rem;
  padding:7px 16px;
  border-radius:100px;
  font-family:'Fraunces',serif;
  box-shadow:0 8px 18px -8px rgba(31,58,46,.3);
}
.slide .body{
  padding:22px 26px 26px;
  text-align:center;
}
.slide h3{font-size:1.2rem;margin-bottom:8px;line-height:1.3;}
.slide p{font-size:.92rem;color:var(--tinta-suave);margin:0;line-height:1.5;}

.nav-btn{
  position:absolute;
  top:calc(50% - 60px);
  transform:translateY(-50%);
  background:rgba(255,253,248,.9);
  border:none;
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--verde-alecrim);
  box-shadow:0 10px 22px -10px rgba(31,58,46,.4);
  transition:background .25s ease, transform .2s ease;
  z-index:5;
}
.nav-btn:hover{background:var(--verde-alecrim);color:#fff;}
.nav-btn:active{transform:translateY(-50%) scale(.92);}
.nav-btn.prev{left:14px;}
.nav-btn.next{right:14px;}
.nav-btn svg{width:20px;height:20px;}

.counter{
  text-align:center;
  margin-top:16px;
  font-family:'Fraunces',serif;
  font-style:italic;
  color:var(--tinta-suave);
  font-size:.9rem;
}

.dots{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:14px;
  flex-wrap:wrap;
  max-width:100%;
}
.dots button{
  width:7px;
  height:7px;
  border-radius:50%;
  border:none;
  background:var(--sálvia-clara);
  cursor:pointer;
  padding:0;
  transition:background .25s ease, transform .25s ease;
}
.dots button.active{
  background:var(--rosa);
  transform:scale(1.3);
}

@media(max-width:520px){
  .nav-btn{width:38px;height:38px;}
  .nav-btn svg{width:16px;height:16px;}
  .slide .body{padding:18px 20px 22px;}
  .slide h3{font-size:1.05rem;}
}
</style>

  {n:"Arranjo com Girassol e Rosa Azul", d:"Girassol e rosa azul.", p:70, img:"buque-118.jpg"},
  {n:"Arranjo com Girassol e Nutella", d:"Girassol, chocolate e Nutella.", p:150, img:"buque-119.jpg"},
  {n:"Coração de Pelúcia com Chocolate", d:"Coração de pelúcia com chocolate e espumante.", p:225, img:"buque-120.jpg"},
  {n:"Caixa com Rosas e Chocolate", d:"Rosas vermelhas importadas, chocolate e almofada de coração.", p:210, img:"buque-121.jpg"},
];

function money(v){
  return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

const track = document.getElementById('track');
const dotsWrap = document.getElementById('dots');
const counter = document.getElementById('counter');
let index = 0;

track.innerHTML = PRODUCTS.map(p => `
  <div class="slide">
    <div class="imgwrap">
      <img src="${p.img}" alt="${p.n} - Floricultura Alecrim" loading="lazy">
      <div class="price-tag">${p.p === null ? 'Sob consulta' : 'R$ ' + money(p.p)}</div>
    </div>
    <div class="body">
      <h3>${p.n}</h3>
      <p>${p.d}</p>
    </div>
  </div>
`).join('');

// dots limited/grouped visually if too many — keep simple thin dots
dotsWrap.innerHTML = PRODUCTS.map((_, i) => `<button data-i="${i}" aria-label="Ir para item ${i+1}"></button>`).join('');
const dotButtons = dotsWrap.querySelectorAll('button');

function update(){
  track.style.transform = `translateX(-${index * 100}%)`;
  counter.textContent = `${index + 1} / ${PRODUCTS.length}`;
  dotButtons.forEach((b, i) => b.classList.toggle('active', i === index));
  dotButtons[index].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}

function goTo(i){
  index = (i + PRODUCTS.length) % PRODUCTS.length;
  update();
}

document.getElementById('nextBtn').addEventListener('click', () => goTo(index + 1));
document.getElementById('prevBtn').addEventListener('click', () => goTo(index - 1));
dotButtons.forEach(b => b.addEventListener('click', () => goTo(Number(b.dataset.i))));

// swipe support
let startX = 0;
track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
track.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (dx > 50) goTo(index - 1);
  else if (dx < -50) goTo(index + 1);
}, {passive:true});

// keyboard support
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(index + 1);
  if (e.key === 'ArrowLeft') goTo(index - 1);
});

update();
</script>
</body>
