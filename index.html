<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel de Buquês | Floricultura Alecrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde-alecrim:#1f3a2e;
  --verde-alecrim-2:#2c4c3b;
  --sálvia:#7f9b81;
  --sálvia-clara:#c9d8c4;
  --papel:#f7f2e7;
  --creme:#fffdf8;
  --rosa:#c5294f;
  --rosa-clara:#f3dde1;
  --tinta:#20281f;
  --tinta-suave:#4a5245;
  --sombra: 0 18px 40px -20px rgba(31,58,46,.35);
  --sombra-forte: 0 26px 60px -22px rgba(31,58,46,.45);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 18% 12%, rgba(90,130,95,.35), transparent 55%),
    radial-gradient(ellipse at 85% 88%, rgba(197,41,79,.28), transparent 55%),
    linear-gradient(155deg, #1a2b20 0%, #16261c 28%, #0f1a14 58%, #1c1410 100%);
  color:var(--papel);
  font-family:'Work Sans',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  min-height:100dvh;
  padding:clamp(28px,5vw,64px) 24px;
  padding-top:calc(clamp(28px,5vw,64px) + env(safe-area-inset-top));
  padding-bottom:calc(clamp(28px,5vw,64px) + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--verde-alecrim);}
.script{font-family:'Caveat',cursive;font-weight:600;}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}

.carousel-wrap{
  width:100%;
  max-width:min(860px, 92vw);
  margin:0 auto;
}
.carousel-head{
  text-align:center;
  margin-bottom:clamp(30px,4vw,48px);
}
.carousel-head .eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-family:'Work Sans',sans-serif;
  font-size:clamp(.85rem,1.3vw,1.05rem);
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--rosa-clara);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  padding:11px 26px;
  border-radius:100px;
  margin-bottom:22px;
}
.carousel-head .eyebrow::before{content:"❧";color:var(--sálvia-clara);font-size:1em;}
.carousel-head h1{
  font-size:clamp(2.1rem,3.6vw,3.2rem);
  font-style:italic;
  font-weight:500;
  line-height:1.2;
  letter-spacing:-.01em;
  color:var(--creme);
  max-width:15em;
  margin:0 auto;
  text-wrap:balance;
}

.carousel{
  position:relative;
  background:var(--creme);
  border-radius:34px;
  box-shadow:0 40px 90px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}

/* ---- image stage: fixed square, nav buttons anchor here ---- */
.stage{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:var(--sálvia-clara);
}
.img-track{
  display:flex;
  height:100%;
  transition:transform .45s cubic-bezier(.65,0,.35,1);
  will-change:transform;
}
.img-slide{
  min-width:100%;
  height:100%;
  position:relative;
}
.img-slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
  -webkit-user-select:none;
  user-select:none;
}
.price-tag{
  position:absolute;
  top:24px;
  right:24px;
  background:rgba(255,253,248,.95);
  backdrop-filter:blur(4px);
  color:var(--rosa);
  font-weight:700;
  font-size:clamp(1.15rem,1.9vw,1.45rem);
  padding:11px 24px;
  border-radius:100px;
  font-family:'Fraunces',serif;
  box-shadow:0 12px 26px -10px rgba(31,58,46,.4);
  z-index:2;
}
.stage::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(21,42,32,.45), transparent 34%);
  pointer-events:none;
}

.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,253,248,.92);
  border:none;
  width:clamp(58px,7vw,76px);
  height:clamp(58px,7vw,76px);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--verde-alecrim);
  box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
  transition:background .2s ease, transform .15s ease, opacity .2s ease;
  z-index:5;
}
.nav-btn:hover{background:var(--verde-alecrim);color:#fff;}
.nav-btn:active{transform:translateY(-50%) scale(.9);}
.nav-btn:focus-visible{outline:3px solid var(--rosa);outline-offset:3px;}
.nav-btn.prev{left:24px;}
.nav-btn.next{right:24px;}
.nav-btn svg{width:30px;height:30px;stroke-width:2.2;}

/* ---- caption area: animates height to fit each slide's text ---- */
.caption-viewport{
  overflow:hidden;
  transition:height .35s ease;
}
.caption-track{
  display:flex;
  transition:transform .45s cubic-bezier(.65,0,.35,1);
}
.caption-slide{
  min-width:100%;
  padding:44px 56px 50px;
  text-align:center;
}
.caption-slide h3{
  font-size:clamp(1.7rem,2.6vw,2.15rem);
  font-weight:600;
  letter-spacing:-.01em;
  margin-bottom:14px;
  line-height:1.32;
  color:var(--verde-alecrim);
}
.caption-slide p{
  font-size:clamp(1.1rem,1.5vw,1.3rem);
  font-weight:400;
  color:var(--tinta-suave);
  margin:0;
  line-height:1.6;
  letter-spacing:.005em;
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin-top:32px;
}
.counter{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  color:var(--sálvia-clara);
  font-size:clamp(1.1rem,1.5vw,1.35rem);
  letter-spacing:.02em;
  white-space:nowrap;
  min-width:100px;
  text-align:center;
}
.progress-track{
  flex:1;
  max-width:360px;
  height:6px;
  background:rgba(255,255,255,.14);
  border-radius:100px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg, var(--rosa), var(--rosa-clara));
  border-radius:100px;
  transition:width .45s cubic-bezier(.65,0,.35,1);
}

.dots-hint{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:14px;
}
.dots-hint span{
  font-size:.78rem;
  color:var(--sálvia);
  font-weight:500;
}

@media(min-width:900px){
  .nav-btn{width:80px;height:80px;}
  .nav-btn svg{width:32px;height:32px;}
}
@media(max-width:360px){
  .carousel{border-radius:22px;}
  .caption-slide{padding:26px 22px 28px;}
}
</style>
</head>
<body>

<div class="carousel-wrap">
  <div class="carousel-head">
    <div class="eyebrow">nossa seleção completa</div>
    <h1>Passe e conheça nossos buquês</h1>
  </div>

  <div class="carousel" id="carousel">
    <div class="stage" id="stage">
      <div class="img-track" id="imgTrack"></div>
      <button class="nav-btn prev" id="prevBtn" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav-btn next" id="nextBtn" aria-label="Próximo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="caption-viewport" id="captionViewport">
      <div class="caption-track" id="captionTrack"></div>
    </div>
  </div>

  <div class="meta-row">
    <div class="counter" id="counter"></div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </div>
</div>

<script>
const PRODUCTS = [
  {n:"Buquê Luxo com Rosas Vermelhas", d:"Buquê grande de rosas vermelhas importadas com folhagem ruscus.", p:410, img:"buque-20.jpg"},
  {n:"Buquê Personalizado", d:"Rosas brancas, astromélia branca e botões verdes, com folhagem.", p:270, img:"buque-09.jpg"},
  {n:"Buquê com Rosas Pink Importadas", d:"Rosas pink importadas, alstroemeria e gipsófila.", p:250, img:"buque-02.jpg"},
  {n:"Buquê com Girassol e Rosas Vermelhas", d:"Rosas vermelhas importadas, girassol, gipsófila, astromélias e folhagem.", p:250, img:"buque-22.jpg"},
  {n:"Buquê com Gérberas, Boca-de-Leão e Rosas Cor de Rosa", d:"Gérberas, boca-de-leão, rosas cor de rosa, gipsófila e folhagem.", p:220, img:"buque-122.jpg"},
  {n:"Buquê com Rosas Coloridas", d:"Rosas vermelhas, pink, amarelas e brancas, com astromélia e gipsófila.", p:250, img:"buque-24.jpg"},
  {n:"Buquê de Girassóis", d:"Girassóis, astromélia branca e folhagem.", p:250, img:"buque-27.jpg"},
  {n:"Buquê Misto Colorido", d:"Girassol, gérberas coloridas, flor do campo e rosas coloridas.", p:220, img:"buque-04.jpg"},
  {n:"Buquê com Rosas Lilás Importadas", d:"Rosas lilás importadas, alstroemeria cor de rosa e gipsófila.", p:210, img:"buque-01.jpg"},
  {n:"Buquê com Lírio Pink", d:"Lírio pink e gipsófila, com folhagem.", p:190, img:"buque-26.jpg"},
  {n:"Buquê com Lírio Branco", d:"Lírio branco e gipsófila, com folhagem.", p:180, img:"buque-19.jpg"},
  {n:"Buquê com Copo-de-Leite Roxo e Girassol", d:"Copo-de-leite roxo, girassol, rosas lilás e folhagem.", p:180, img:"buque-21.jpg"},
  {n:"Buquê de Flores do Campo Coloridas", d:"Crisântemos e margaridas em tons variados, astromélia laranja e flores do campo.", p:180, img:"buque-18.jpg"},
  {n:"Buquê com 6 Rosas Vermelhas Importadas", d:"Rosas vermelhas importadas, astromélia branca e flores de acabamento.", p:175, img:"buque-08.jpg"},
  {n:"Buquê com Rosas Amarelas e Brancas", d:"Rosas amarelas, rosas brancas, astromélia e gipsófila.", p:175, img:"buque-29.jpg"},
  {n:"Buquê com Lírio Pink e Rosas Lilás", d:"Lírio pink, rosas lilás, statice e lisianthus cor de rosa.", p:160, img:"buque-05.jpg"},
  {n:"Buquê com 5 Rosas Vermelhas Importadas", d:"Rosas vermelhas importadas com gipsófila e folhagem.", p:160, img:"buque-03.jpg"},
  {n:"Buquê de Flores do Campo", d:"Mix de crisântemos, margaridas e flores do campo em tons variados.", p:145, img:"buque-23.jpg"},
  {n:"Mini Buquê de Flores do Campo", d:"Crisântemos amarelos, brancos e roxos, gérberas terracota e folhagem.", p:120, img:"buque-34.jpg"},
  {n:"Buquê de Flores do Campo com Girassol e Lírio", d:"Flores do campo, alstroemérias, girassol, rosa e lírio.", p:280, img:"buque-36.jpg"},
  {n:"Buquê Misto com Rosas e Girassol", d:"Rosas vermelhas importadas, girassol e margaridas brancas.", p:250, img:"buque-38.jpg"},
  {n:"Buquê de Lírios Brancos e Tulipas", d:"Lírios brancos e tulipas.", p:330, img:"buque-40.jpg"},
  {n:"Buquê Misto de Gérberas e Pinóquio", d:"Gérberas e Pinóquio em tons variados.", p:360, img:"buque-41.jpg"},
  {n:"Buquê de Rosas Importadas Vermelhas", d:"Rosas importadas vermelhas.", p:160, img:"buque-42.jpg"},
  {n:"Buquê de Rosas Pink com Alstroemélia", d:"Rosas pink importadas, alstroemélia rosa e gipsófila.", p:100, img:"buque-43.jpg"},
  {n:"Buquê de Lírio Rosa e Goivo", d:"Lírio rosa, goivo rosa e eucalipto.", p:120, img:"buque-45.jpg"},
  {n:"Buquê com Girassol e Statice", d:"Girassol, ruscus e statice.", p:90, img:"buque-46.jpg"},
  {n:"Buquê Misto de Flores do Campo", d:"Flores do campo em tons variados.", p:120, img:"buque-48.jpg"},
  {n:"Buquê de Flores do Campo Silvestre", d:"Flores do campo silvestres, coloridas.", p:150, img:"buque-49.jpg"},
  {n:"Buquê Misto com Rosa e Girassol", d:"Flores do campo coloridas, rosa e girassol.", p:220, img:"buque-51.jpg"},
  {n:"Buquê com Rosa Inglesa e Flores do Campo", d:"Rosa inglesa e flores do campo coloridas.", p:150, img:"buque-52.jpg"},
  {n:"Buquê com Gérbera e Tango", d:"Gérbera e tango.", p:120, img:"buque-53.jpg"},
  {n:"Buquê de Flores do Campo e Gérberas", d:"Flores do campo e gérberas.", p:180, img:"buque-54.jpg"},
  {n:"Buquê de Rosa Azul e Alstroemélia", d:"Rosa azul, alstroemélias brancas e gipsófila.", p:180, img:"buque-55.jpg"},
  {n:"Buquê de Rosa Vermelha Importada (24 unidades)", d:"Buquê com 24 rosas vermelhas importadas.", p:390, img:"buque-57.jpg"},
  {n:"Buquê de Girassol com Rosas e Alstroemélia", d:"Girassol, rosas vermelhas e alstroemélia amarela, papel craft.", p:250, img:"buque-58.jpg"},
  {n:"Buquê de Hortênsia, Lírio e Pinóquio", d:"Hortênsia, lírio, goivo e Pinóquio amarelo.", p:360, img:"buque-61.jpg"},
  {n:"Mini Buquê Flores do Campo \"Bailarina\"", d:"Flores do campo coloridas, estilo bailarina.", p:60, img:"buque-63.jpg"},
  {n:"Buquê \"Bailarina\" com Ursinho", d:"Flores do campo com ursinho de pelúcia \"Amor\".", p:160, img:"buque-64.jpg"},
  {n:"Mini Buquê de Rosa Azul Importada", d:"Rosa azul importada com alstroemélia branca.", p:105, img:"buque-65.jpg"},
  {n:"Buquê Misto com Gérbera, Lírio e Girassol", d:"Gérbera, lírio, girassol e rosa.", p:250, img:"buque-70.jpg"},
  {n:"Buquê de Alstroemélia e Boca-de-Leão", d:"Alstroemélia colorida e boca-de-leão.", p:180, img:"buque-88.jpg"},
  {n:"Buquê Misto de Gérbera e Rosas", d:"Gérbera, rosas e flores do campo.", p:220, img:"buque-94.jpg"},
  {n:"Buquê de Rosas Vermelhas Importadas", d:"Rosas vermelhas importadas com folhagem ruscus, em embalagem preta.", p:250, img:"buque-123.jpg"},

];

function money(v){
  return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

const imgTrack = document.getElementById('imgTrack');
const captionTrack = document.getElementById('captionTrack');
const captionViewport = document.getElementById('captionViewport');
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const total = PRODUCTS.length;
let index = 0;

imgTrack.innerHTML = PRODUCTS.map(p => `
  <div class="img-slide">
   <img src="${p.img}" alt="${p.n} - Floricultura Alecrim" loading="lazy" decoding="async">
    <div class="price-tag">${p.p === null ? 'Sob consulta' : 'R$ ' + money(p.p)}</div>
  </div>
`).join('');

captionTrack.innerHTML = PRODUCTS.map(p => `
  <div class="caption-slide">
    <h3>${p.n}</h3>
    <p>${p.d}</p>
  </div>
`).join('');

const captionSlides = captionTrack.querySelectorAll('.caption-slide');

function setCaptionHeight(){
  captionViewport.style.height = captionSlides[index].offsetHeight + 'px';
}

function update(instant){
  const prevTransition = imgTrack.style.transition;
  if (instant){
    imgTrack.style.transition = 'none';
    captionTrack.style.transition = 'none';
  }
  imgTrack.style.transform = `translateX(-${index * 100}%)`;
  captionTrack.style.transform = `translateX(-${index * 100}%)`;
  if (instant){
    void imgTrack.offsetWidth; // force reflow before restoring transition
    imgTrack.style.transition = prevTransition;
    captionTrack.style.transition = prevTransition;
  }
  counter.textContent = `${index + 1} / ${total}`;
  progressBar.style.width = `${((index + 1) / total) * 100}%`;
  setCaptionHeight();
}

function goTo(i){
  index = (i + total) % total;
  update();
}

document.getElementById('nextBtn').addEventListener('click', () => goTo(index + 1));
document.getElementById('prevBtn').addEventListener('click', () => goTo(index - 1));

// keyboard support
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(index + 1);
  if (e.key === 'ArrowLeft') goTo(index - 1);
});

// unified pointer support: touch (mobile/tablet) + mouse drag (desktop)
let dragging = false;
let startX = 0;
let deltaX = 0;

function dragStart(x){
  dragging = true;
  startX = x;
  deltaX = 0;
  imgTrack.style.transition = 'none';
  captionTrack.style.transition = 'none';
}
function dragMove(x){
  if (!dragging) return;
  deltaX = x - startX;
  const stageWidth = stage.getBoundingClientRect().width;
  const pct = (deltaX / stageWidth) * 100;
  imgTrack.style.transform = `translateX(calc(-${index * 100}% + ${pct}%))`;
  captionTrack.style.transform = `translateX(calc(-${index * 100}% + ${pct}%))`;
}
function dragEnd(){
  if (!dragging) return;
  dragging = false;
  imgTrack.style.transition = '';
  captionTrack.style.transition = '';
  const stageWidth = stage.getBoundingClientRect().width;
  const threshold = stageWidth * 0.15;
  if (deltaX > threshold) goTo(index - 1);
  else if (deltaX < -threshold) goTo(index + 1);
  else update();
  deltaX = 0;
}

stage.addEventListener('touchstart', e => dragStart(e.touches[0].clientX), {passive:true});
stage.addEventListener('touchmove', e => dragMove(e.touches[0].clientX), {passive:true});
stage.addEventListener('touchend', dragEnd);

stage.addEventListener('mousedown', e => { e.preventDefault(); dragStart(e.clientX); });
window.addEventListener('mousemove', e => dragMove(e.clientX));
window.addEventListener('mouseup', dragEnd);
stage.style.cursor = 'grab';
stage.addEventListener('mousedown', () => stage.style.cursor = 'grabbing');
window.addEventListener('mouseup', () => stage.style.cursor = 'grab');

// keep caption height correct on resize
window.addEventListener('resize', setCaptionHeight);

update(true);
</script>
</body>
</html>
